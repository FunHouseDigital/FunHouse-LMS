[project]
name = "funhouse-pipeline"
version = "0.1.0"
description = "FunHouse Phase 0 document-intelligence pipeline: Collect -> Extract -> Validate -> Load -> Archive."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "FunHouse Digital" }]

dependencies = [
    # PostgreSQL driver (Req 6.4 - PostgreSQL is the only database system).
    "psycopg[binary]>=3.1",
    # AWS SDK - used behind interfaces for Bedrock Batch and S3 (isolated per design).
    "boto3>=1.34",
    # .docx parser for the lesson text path (Req 5.1 - no image OCR).
    "python-docx>=1.1",
    # YAML loader for configuration.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Property-based testing library mandated by the design's Testing Strategy.
    "hypothesis>=6.100",
    # AWS mock for S3/Bedrock in tests (no live AWS calls).
    "moto>=5.0",
    # Optional: spins up an ephemeral PostgreSQL when server binaries are present.
    "pytest-postgresql>=6.0",
]

[project.scripts]
funhouse-pipeline = "funhouse_pipeline.orchestrator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["funhouse_pipeline"]

# Ensure the .sql migration files ship with the package.
[tool.hatch.build.targets.wheel.force-include]
"funhouse_pipeline/sql" = "funhouse_pipeline/sql"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: tests that require a reachable PostgreSQL server (skipped automatically when none is available).",
    "property: property-based tests (Hypothesis).",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.black]
target-version = ["py311"]
line-length = 100
