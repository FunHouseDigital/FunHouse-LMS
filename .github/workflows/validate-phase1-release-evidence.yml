name: Validate Phase 1 Release Evidence
run-name: Validate Phase 1 Release Evidence · ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: read
  statuses: read

jobs:
  validate:
    name: Collect and validate exact-SHA evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a protected main dispatch
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${DISPATCH_REF}" != "refs/heads/main" ]]; then
            echo "Release evidence must be dispatched from refs/heads/main."
            exit 1
          fi
          if [[ ! "${DISPATCH_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The dispatched commit is not a lowercase full SHA."
            exit 1
          fi

      - name: Check out the exact validator SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Collect and validate read-only evidence
        id: evidence
        continue-on-error: true
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -m funhouse_pipeline.release_evidence check \
            --repository "${GITHUB_REPOSITORY}" \
            --candidate-sha "${CANDIDATE_SHA}" \
            --snapshot release-evidence/snapshot.json \
            --report-json release-evidence/report.json \
            --report-markdown release-evidence/report.md

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          if [[ -f release-evidence/report.md ]]; then
            cat release-evidence/report.md >> "${GITHUB_STEP_SUMMARY}"
          else
            printf '%s\n' \
              '# Phase 1 release evidence' \
              '' \
              'Evidence collection or schema validation failed. No automated PASS was produced.' \
              >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload secret-free evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase1-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-evidence/snapshot.json
            release-evidence/report.json
            release-evidence/report.md
          if-no-files-found: error
          retention-days: 30

      - name: Enforce automated verdict
        if: always() && steps.evidence.outcome != 'success'
        run: |
          echo "Phase 1 automated release evidence is blocked or invalid."
          exit 1
