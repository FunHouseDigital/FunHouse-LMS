name: Rotate Live Founder Password

# Manual, serialized production credential rotation for the seeded Aya founder.
# The plaintext is supplied only by the protected production environment and
# is never accepted as a workflow input or written to logs. This mirrors the
# Loyiso rotation but is bound exclusively to the Aya founder account.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Confirm Aya's live founder password rotation"
        type: choice
        required: true
        options:
          - rotate-live-founder-password

permissions:
  contents: read

concurrency:
  group: live-supabase-bootstrap
  cancel-in-progress: false

jobs:
  rotate:
    name: Validate and rotate Aya founder login
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      BOOTSTRAP_USER_NAME: Aya
      VERCEL_API_URL: https://fun-house-lms.vercel.app

    steps:
      - name: Require main branch and explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this production workflow from the main branch."
            exit 1
          fi
          if [ "$CONFIRMATION" != "rotate-live-founder-password" ]; then
            echo "::error::Founder password rotation confirmation did not match."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application
        run: python -m pip install .

      - name: Verify API liveness
        run: curl --fail --silent --show-error --max-redirs 0 "${VERCEL_API_URL}/health" > /dev/null

      - name: Install pinned Supabase CA certificate
        env:
          SUPABASE_CA_URL: https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt
          SUPABASE_CA_SHA256: 700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7
        run: |
          set -euo pipefail
          certificate="${RUNNER_TEMP}/supabase-prod-ca-2021.crt"
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --max-redirs 0 \
            "$SUPABASE_CA_URL" \
            --output "$certificate"
          echo "${SUPABASE_CA_SHA256}  ${certificate}" | sha256sum --check --strict
          chmod 600 "$certificate"

      - name: Normalize and validate protected settings
        env:
          RAW_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          DB_PORT: ${{ vars.SUPABASE_DB_PORT || '5432' }}
          RAW_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          RAW_MAINTENANCE_ROLE: ${{ vars.SUPABASE_DB_MAINTENANCE_ROLE }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          RAW_FOUNDER_PASSWORD: ${{ secrets.BOOTSTRAP_USER_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import re
          import uuid

          required = {
              "SUPABASE_DB_HOST": os.environ.get("RAW_DB_HOST", ""),
              "SUPABASE_DB_USER": os.environ.get("RAW_DB_USER", ""),
              "SUPABASE_DB_PASSWORD": os.environ.get("DB_PASSWORD", ""),
              "BOOTSTRAP_USER_PASSWORD": os.environ.get("RAW_FOUNDER_PASSWORD", ""),
          }
          missing = [name for name, value in required.items() if not value]
          if missing:
              raise SystemExit(
                  "Required production settings are missing: " + ", ".join(missing)
              )

          # Normalize identifiers only. Password whitespace is significant.
          host = required["SUPABASE_DB_HOST"].strip()
          user = required["SUPABASE_DB_USER"].strip()
          password = required["BOOTSTRAP_USER_PASSWORD"]
          if "\r" in password or "\n" in password:
              raise SystemExit(
                  "BOOTSTRAP_USER_PASSWORD must be a single-line password without CR or LF characters."
              )
          maintenance_role = os.environ.get("RAW_MAINTENANCE_ROLE", "").strip()
          if not re.fullmatch(r"[a-z0-9-]+\.pooler\.supabase\.com", host):
              raise SystemExit(
                  "SUPABASE_DB_HOST must contain only the Supabase session-pooler host."
              )
          if os.environ.get("DB_PORT") != "5432":
              raise SystemExit("Use session-pooler port 5432 for password rotation.")
          if not re.fullmatch(r"(?:postgres|funhouse_migrator)\.[a-z0-9]+", user):
              raise SystemExit(
                  "SUPABASE_DB_USER must be the owner or migrator pooler username shown by Supabase Connect."
              )
          if user.startswith("funhouse_migrator.") and maintenance_role != "funhouse_owner":
              raise SystemExit(
                  "SUPABASE_DB_MAINTENANCE_ROLE must be funhouse_owner when using funhouse_migrator."
              )
          if maintenance_role not in ("", "funhouse_owner"):
              raise SystemExit(
                  "SUPABASE_DB_MAINTENANCE_ROLE must be empty or funhouse_owner."
              )

          print(f"::add-mask::{host}")
          print(f"::add-mask::{user}")
          delimiter = f"FUNHOUSE_PASSWORD_{uuid.uuid4().hex}"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"DB_HOST={host}\n")
              environment.write(f"DB_USER={user}\n")
              environment.write(
                  f"BOOTSTRAP_USER_PASSWORD<<{delimiter}\n"
                  f"{password}\n"
                  f"{delimiter}\n"
              )
          print("Connection identifiers and dedicated founder credential validated; no values were logged.")
          PY

      - name: Rotate only Aya's password hash
        env:
          DB_PORT: ${{ vars.SUPABASE_DB_PORT || '5432' }}
          DB_NAME: ${{ vars.SUPABASE_DB_NAME || 'postgres' }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DB_SSLMODE: verify-full
          DB_MAINTENANCE_ROLE: ${{ vars.SUPABASE_DB_MAINTENANCE_ROLE }}
          PGSSLROOTCERT: ${{ runner.temp }}/supabase-prod-ca-2021.crt
          PGCONNECT_TIMEOUT: "15"
          PGOPTIONS: "-c lock_timeout=15000 -c statement_timeout=300000"
        run: python -m funhouse_pipeline.db.bootstrap_user --rotate-founder-password

      - name: Verify live founder login
        run: |
          python - <<'PY'
          import base64
          import binascii
          import json
          import os
          import urllib.error
          import urllib.request

          class NoRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          request = urllib.request.Request(
              os.environ["VERCEL_API_URL"] + "/auth/login",
              data=json.dumps(
                  {
                      "identifier": "Aya",
                      "password": os.environ["BOOTSTRAP_USER_PASSWORD"],
                  }
              ).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          opener = urllib.request.build_opener(NoRedirects)
          try:
              with opener.open(request, timeout=30) as response:
                  status = response.status
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              status = exc.code
              payload = {}

          token = payload.get("access_token") if isinstance(payload, dict) else None
          try:
              parts = token.split(".")
              if len(parts) != 3:
                  raise ValueError
              encoded = parts[1] + "=" * (-len(parts[1]) % 4)
              claims = json.loads(base64.urlsafe_b64decode(encoded.encode("ascii")))
          except (
              AttributeError,
              UnicodeError,
              ValueError,
              binascii.Error,
              json.JSONDecodeError,
          ):
              claims = {}

          valid_identity = (
              status == 200
              and isinstance(token, str)
              and bool(token)
              and payload.get("token_type") == "bearer"
              and isinstance(payload.get("expires_at"), str)
              and isinstance(claims, dict)
              and isinstance(claims.get("sub"), str)
              and claims.get("role") == "founder"
          )
          if not valid_identity:
              raise SystemExit(
                  f"Live founder login probe failed with HTTP {status} or unexpected founder claims."
              )

          protected_request = urllib.request.Request(
              os.environ["VERCEL_API_URL"] + "/players",
              headers={
                  "Accept": "application/json",
                  "Authorization": f"Bearer {token}",
              },
              method="GET",
          )
          try:
              with opener.open(protected_request, timeout=30) as response:
                  protected_status = response.status
                  protected_payload = json.load(response)
          except urllib.error.HTTPError as exc:
              protected_status = exc.code
              protected_payload = None
          if protected_status != 200 or not isinstance(protected_payload, list):
              raise SystemExit(
                  f"Live founder protected player read failed with HTTP {protected_status}."
              )
          print(
              "Live founder login and protected read succeeded; "
              "the JWT, password, and roster were not logged."
          )
          PY

      - name: Publish non-secret summary
        run: |
          {
            echo "## Founder password rotation complete"
            echo ""
            echo "- Only the unique seeded Aya founder row was eligible"
            echo "- Expected founder role and Smithfield scope were verified under table and row locks"
            echo "- Only a bcrypt hash was stored"
            echo "- The deployed Vercel API accepted the new founder credential and protected read"
            echo "- Loyiso and Facilitator credentials were not changed"
          } >> "$GITHUB_STEP_SUMMARY"
