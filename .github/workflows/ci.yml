name: CI

# Free-tier GitHub Actions CI. No AWS credentials, no `terraform apply`, no
# remote backend — every job runs entirely offline against committed fixtures
# and ephemeral services. This is CI tooling (PRD §3.1), not runtime infra.
#
# Component-presence guards
# -------------------------
# The three components of this repo land on `main` via separate PRs and live on
# different branches until merged:
#   * infra/                     → this deployment branch
#   * pyproject.toml + tests/    → main (Python pipeline + API)
#   * web/ (PWA source manifest) → the Revenue PWA PR branch
# A blanket 3-job workflow would fail on any branch that is missing a component.
# To stay green *and* meaningful everywhere, each job begins with a file-existence
# guard: if its component is checked out, the job runs its real checks unchanged
# (full enforcement); if the component is absent, the job prints a clear
# "not present on this branch — skipping" message and ends successfully (green).
# On `main` all three components coexist, so every job runs and enforces.
# NOTE: we deliberately do NOT use `paths:` triggers — those would skip the whole
# workflow and can leave required checks pending. In-job guards always report a
# status so branch protection stays satisfiable.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # infra-gates: offline Terraform + shell assertions (no AWS, no backend).
  # Runs only when the infra/ component is present (guarded on infra/providers.tf).
  # ---------------------------------------------------------------------------
  infra-gates:
    name: infra-gates (terraform fmt/validate + assertion scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — detect infra/ component
        id: guard
        run: |
          if [ -f infra/providers.tf ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "infra/ present — running infra-gates."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "infra/providers.tf not found on this branch — skipping infra-gates (runs on main / the deployment branch)."
          fi

      - name: Install shellcheck + jq
        if: steps.guard.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      - uses: hashicorp/setup-terraform@v3
        if: steps.guard.outputs.present == 'true'
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: terraform fmt -check -recursive
        if: steps.guard.outputs.present == 'true'
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: terraform init (no backend) + validate
        if: steps.guard.outputs.present == 'true'
        working-directory: infra
        run: |
          terraform init -backend=false
          terraform validate

      - name: shellcheck assertion scripts
        if: steps.guard.outputs.present == 'true'
        working-directory: infra
        run: |
          shellcheck scripts/assert_residency.sh
          shellcheck scripts/assert_no_forbidden.sh

      - name: Residency + forbidden-service gates vs committed fixtures
        if: steps.guard.outputs.present == 'true'
        working-directory: infra
        run: |
          set -eu
          # Passing fixture MUST be accepted (exit 0).
          sh scripts/assert_residency.sh    scripts/fixtures/plan_pass.json
          sh scripts/assert_no_forbidden.sh scripts/fixtures/plan_pass.json

          # Failing fixture MUST be rejected (non-zero). Invert so the job
          # passes only when the bad plan is correctly caught.
          if ! sh scripts/assert_residency.sh scripts/fixtures/plan_fail.json; then
            echo "OK: residency gate correctly rejected the failing fixture"
          else
            echo "ERROR: residency gate accepted a plan it should have rejected" >&2
            exit 1
          fi

          if ! sh scripts/assert_no_forbidden.sh scripts/fixtures/plan_fail.json; then
            echo "OK: no-forbidden gate correctly rejected the failing fixture"
          else
            echo "ERROR: no-forbidden gate accepted a plan it should have rejected" >&2
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # python-tests: full pipeline + API pytest suite against a real PostgreSQL.
  # The DB-backed / property tests actually EXECUTE here (they only skip when
  # no server is reachable), so a live service is provided.
  # Runs only when the Python component is present (guarded on pyproject.toml
  # AND a tests/ directory).
  # ---------------------------------------------------------------------------
  python-tests:
    name: python-tests (pytest w/ PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: funhouse
          POSTGRES_PASSWORD: funhouse
          POSTGRES_DB: funhouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U funhouse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # These names match funhouse_pipeline.config.settings (read by the
      # tests/conftest.py db_connection fixture via load_config().database.dsn()).
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: funhouse
      DB_USER: funhouse
      DB_PASSWORD: funhouse
      DB_SSLMODE: disable
      PGOPTIONS: "-c funhouse.enable_runtime_role=on"

    steps:
      - uses: actions/checkout@v4

      - name: Guard — detect Python component
        id: guard
        run: |
          if [ -f pyproject.toml ] && [ -d tests ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "pyproject.toml + tests/ present — running python-tests."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "pyproject.toml and/or tests/ not found on this branch — skipping python-tests (runs on main)."
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.present == 'true'
        with:
          python-version: "3.11"

      - name: Install project + dev extras
        if: steps.guard.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest (full suite, DB-backed tests execute)
        if: steps.guard.outputs.present == 'true'
        run: pytest

  # ---------------------------------------------------------------------------
  # web-tests: offline-first Revenue PWA (React/Vite) — test + production build.
  # Runs only when the PWA source manifest is present (guarded on
  # web/package.json — the committed source, NOT web/dist or node_modules,
  # which are build artifacts).
  # ---------------------------------------------------------------------------
  web-tests:
    name: web-tests (npm test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — detect web/ component
        id: guard
        run: |
          if [ -f web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "web/package.json present — running web-tests."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "web/package.json not found on this branch — skipping web-tests (runs on main / the PWA branch)."
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.present == 'true'
        with:
          node-version: "22"

      - name: Install dependencies
        if: steps.guard.outputs.present == 'true'
        working-directory: web
        run: npm ci

      - name: Run web unit tests
        if: steps.guard.outputs.present == 'true'
        working-directory: web
        run: npm run test

      - name: Production build
        if: steps.guard.outputs.present == 'true'
        working-directory: web
        run: npm run build
